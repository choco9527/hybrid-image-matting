[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-image-matting"
version = "0.1.0"
description = "Apple subject masking plus Pillow white-background removal"
requires-python = ">=3.11"
dependencies = ["Pillow>=12.0,<13"]

[project.scripts]
image-matting = "image_matting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

